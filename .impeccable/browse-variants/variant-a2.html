<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A2 — Compact Bar · BasketWise Browse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,600&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<style>
  .page-head{padding:20px 0 12px;}
  .page-title{font-size:26px; font-weight:400; letter-spacing:-.015em; line-height:1.1;}
  .page-sub{margin-top:4px; font-size:12px; color:var(--muted); max-width:56ch;}

  .browse-layout{display:flex; gap:22px; align-items:flex-start; padding-bottom:60px;}
  .cat-sidebar{width:224px; flex-shrink:0;}
  @media(max-width:900px){ .browse-layout{flex-direction:column;} .cat-sidebar{width:100%;} }
  .cat-accordion-header{padding:9px 12px; font-size:12px;}
  .cat-accordion-header.expanded{padding:9px 14px;}
  .cat-sub-row{padding:6px 18px; font-size:11.5px;}
  .cat-sidebar-head{padding:11px 12px; font-size:10px;}

  .content-col{min-width:0; flex:1;}

  .toolbar{position:sticky; top:52px; z-index:20; background:var(--page); display:flex; flex-wrap:wrap; align-items:center; gap:8px; padding:0 0 12px; margin-bottom:14px; border-bottom:1px solid var(--line-strong);}
  .result-count{font-size:11px; color:var(--muted); white-space:nowrap; margin-left:auto;}

  .dd-trigger{padding:6px 12px; font-size:11.5px; gap:6px;}
  .dd-trigger .chevron{width:11px; height:11px;}

  .chip-toggle{display:flex; gap:5px; flex-wrap:wrap;}
  .chip-toggle button{border:1px solid var(--line-strong); background:var(--surface); color:var(--ink); border-radius:9999px; padding:6px 11px; font-size:11px; font-weight:600; transition:all .15s;}
  .chip-toggle button.active{border-color:var(--ink); background:var(--panel);}

  .product-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:10px;}
  @media(min-width:520px){ .product-grid{grid-template-columns:repeat(3,1fr);} }
  @media(min-width:1000px){ .product-grid{grid-template-columns:repeat(4,1fr);} }

  .card{display:flex; flex-direction:column; border:1px solid var(--line); background:var(--surface);}
  .card-img{position:relative; aspect-ratio:1/1; display:flex; align-items:center; justify-content:center; padding:8px; background-image:repeating-linear-gradient(135deg, var(--img-a) 0 7px, var(--img-b) 7px 14px);}
  .card-img span{font-family:'Menlo','Consolas',monospace; font-size:8.5px; letter-spacing:.02em; color:#9b9a8f; text-align:center; line-height:1.35;}
  .card-body{padding:8px 8px 0;}
  .card-name{font-size:11px; font-weight:600; color:var(--ink); line-height:1.3; min-height:28px;}
  .card-meta{margin-top:2px; font-size:10px; color:var(--muted);}
  .price-compare{display:grid; grid-template-columns:1fr 1fr; gap:4px; margin-top:7px; padding-top:7px; border-top:1px solid var(--line);}
  .price-col{display:flex; flex-direction:column; gap:1px; padding:4px 4px; border:1px solid transparent;}
  .price-col.best{border-color:var(--green); background:#f4f8f5;}
  .store-row{display:flex; align-items:center; gap:3px;}
  .store-name{font-size:8.5px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--muted);}
  .price-col.best .store-name{color:var(--green);}
  .check{width:9px; height:9px; flex-shrink:0; color:var(--green);}
  .price-val{font-family:'Newsreader',serif; font-size:15px; line-height:1.05; color:var(--ink);}
  .price-col.best .price-val{color:var(--green);}
  .single-store-note{margin-top:7px; padding-top:7px; border-top:1px solid var(--line); display:flex; align-items:baseline; justify-content:space-between; gap:6px;}
  .single-store-note .price-val{font-size:17px;}
  .only-at{font-size:9px; color:var(--muted); text-align:right; line-height:1.25;}
  .save-badge{display:inline-flex; align-self:flex-start; margin-top:7px; background:var(--yellow); color:var(--yellow-ink); font-size:9px; font-weight:700; padding:2px 5px;}
  .card-actions{padding:7px 8px 8px; margin-top:auto;}
  .add-btn{width:100%; border:none; border-radius:2px; background:var(--green); color:#fff; font-size:11px; font-weight:600; padding:7px 8px; transition:background .15s;}
  .add-btn:hover{background:var(--green-hover);}
  .add-btn.added{background:var(--ink-inverse);}

  .empty-state{display:none; flex-direction:column; align-items:flex-start; gap:6px; border:1px solid var(--line); background:var(--surface); padding:40px 28px; text-align:left;}
  .empty-state.visible{display:flex;}
  .empty-state h3{font-family:'Newsreader',serif; font-size:20px; font-weight:400; color:var(--ink);}
  .empty-state p{font-size:12.5px; color:var(--muted); max-width:44ch;}
  .empty-state button{margin-top:10px; border:1px solid var(--ink); background:transparent; color:var(--ink); border-radius:9999px; padding:8px 16px; font-size:12px; font-weight:600;}
  .empty-state button:hover{background:var(--panel);}
</style>
</head>
<body>
  <div id="banner"></div>
  <div id="header"></div>

  <main class="container">
    <div class="page-head">
      <h1 class="page-title serif">Browse groceries</h1>
      <p class="page-sub">Coles and Woolworths prices shown side-by-side, so the cheaper option is never hidden.</p>
    </div>

    <div class="browse-layout">
      <aside class="cat-sidebar">
        <div class="cat-sidebar-head">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
          Categories
        </div>
        <div id="cat-sidebar-list"></div>
      </aside>

      <div class="content-col">
        <div class="toolbar">
          <div class="dd">
            <button class="dd-trigger" id="sort-trigger" aria-haspopup="true" aria-expanded="false">
              <span id="sort-label">Name: A–Z</span>
              <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
            </button>
            <div class="dd-panel" id="sort-panel"></div>
          </div>
          <div class="chip-toggle" id="store-group" role="group" aria-label="Filter by which store is cheaper">
            <button class="active" data-store="both" aria-pressed="true">Both</button>
            <button data-store="coles" aria-pressed="false">Best at Coles</button>
            <button data-store="woolworths" aria-pressed="false">Best at Woolworths</button>
          </div>
          <span class="result-count" id="result-count"></span>
        </div>

        <div class="product-grid" id="product-grid"></div>
        <div class="empty-state" id="empty-state">
          <h3 class="serif">No items here yet</h3>
          <p>We haven't loaded prices for this category yet, or the store filter is hiding everything in it. Try another category, or show both stores.</p>
          <button id="empty-reset">Show both stores</button>
        </div>
      </div>
    </div>
  </main>

  <div id="footer"></div>

  <script src="data.js"></script>
  <script src="shared.js"></script>
  <script>
    document.getElementById('banner').innerHTML = renderOptionABanner('a2');
    document.getElementById('header').innerHTML = renderHeader();
    document.getElementById('footer').innerHTML = renderFooter();

    let state = { category: "Fruit & Veg", sub: "All", sort: "name-asc", store: "both" };

    function renderCard(p){
      const div = document.createElement('div');
      div.className = 'card';
      const hasBoth = p.coles != null && p.woolworths != null;
      const colesCheaper = hasBoth && p.coles < p.woolworths;
      const woolsCheaper = hasBoth && p.woolworths < p.coles;
      const tie = hasBoth && p.coles === p.woolworths;
      const save = hasBoth ? Math.abs(p.coles - p.woolworths) : 0;

      let priceBlock;
      if(hasBoth){
        priceBlock = `
          <div class="price-compare">
            <div class="price-col ${colesCheaper||tie ? 'best' : ''}">
              <div class="store-row"><span class="store-name">Coles</span>${colesCheaper||tie ? checkIconSvg('check') : ''}</div>
              <span class="price-val serif">${fmt(p.coles)}</span>
            </div>
            <div class="price-col ${woolsCheaper||tie ? 'best' : ''}">
              <div class="store-row"><span class="store-name">Woolworths</span>${woolsCheaper||tie ? checkIconSvg('check') : ''}</div>
              <span class="price-val serif">${fmt(p.woolworths)}</span>
            </div>
          </div>
          ${save > 0 ? `<span class="save-badge">Save ${fmt(save)}</span>` : ''}
        `;
      } else {
        const store = p.coles != null ? 'Coles' : 'Woolworths';
        const price = p.coles != null ? p.coles : p.woolworths;
        priceBlock = `
          <div class="single-store-note">
            <span class="price-val serif">${fmt(price)}</span>
            <span class="only-at">Only at<br>${store}</span>
          </div>
        `;
      }

      div.innerHTML = `
        <div class="card-img"><span>${p.shot}</span></div>
        <div class="card-body">
          <p class="card-name">${p.name}</p>
          <p class="card-meta">${p.unit}</p>
          ${priceBlock}
        </div>
        <div class="card-actions">
          <button class="add-btn" type="button">Add to cart</button>
        </div>
      `;
      return div;
    }

    function renderGrid(){
      const grid = document.getElementById('product-grid');
      const empty = document.getElementById('empty-state');
      const all = PRODUCTS[state.category] || [];
      const filtered = sortProducts(
        all.filter(p => passesPreferredStore(p, state.store) && passesSubFilter(p, state.sub)),
        state.sort
      );

      grid.innerHTML = "";
      if(filtered.length === 0){
        grid.style.display = 'none';
        empty.classList.add('visible');
      } else {
        grid.style.display = 'grid';
        empty.classList.remove('visible');
        filtered.forEach(p => grid.appendChild(renderCard(p)));
      }
      bindAddButtons(grid);
      document.getElementById('result-count').textContent =
        filtered.length > 0 ? `${filtered.length} item${filtered.length === 1 ? '' : 's'}` : '';
    }

    setupCategorySidebar({
      containerId: 'cat-sidebar-list',
      getState: () => state,
      onSelect: ({ category, sub }) => { state.category = category; state.sub = sub; renderGrid(); }
    });

    setupSortDropdown({
      triggerId: 'sort-trigger', panelId: 'sort-panel', labelId: 'sort-label',
      getState: () => state,
      onSelect: (sort) => { state.sort = sort; renderGrid(); }
    });

    document.getElementById('store-group').addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-store]');
      if(!btn) return;
      state.store = btn.dataset.store;
      [...e.currentTarget.children].forEach(b => {
        b.classList.toggle('active', b === btn);
        b.setAttribute('aria-pressed', String(b === btn));
      });
      renderGrid();
    });
    document.getElementById('empty-reset').addEventListener('click', () => {
      state.store = 'both';
      document.querySelectorAll('#store-group button').forEach(b => {
        const isBoth = b.dataset.store === 'both';
        b.classList.toggle('active', isBoth);
        b.setAttribute('aria-pressed', String(isBoth));
      });
      renderGrid();
    });

    renderGrid();
  </script>
</body>
</html>
