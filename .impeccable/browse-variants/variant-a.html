<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Variant A — The Ledger Grid · BasketWise Browse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,600&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<style>
  .page-head{padding:28px 0 18px;}
  .page-eyebrow-row{display:flex; align-items:baseline; justify-content:space-between; gap:16px; flex-wrap:wrap;}
  .page-title{font-size:32px; font-weight:400; letter-spacing:-.015em; line-height:1.1;}
  .page-sub{margin-top:6px; font-size:13px; color:var(--muted); max-width:52ch;}
  .result-count{font-size:12px; color:var(--subtle); white-space:nowrap;}

  .controls-bar{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:14px; padding:14px 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line); margin-bottom:24px;}
  .control-group{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .control-label{font-size:10.5px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--subtle); margin-right:2px;}
  .pill-toggle{display:flex; gap:6px; flex-wrap:wrap;}
  .pill-toggle button{border:1px solid var(--line-strong); background:transparent; color:var(--body); border-radius:9999px; padding:7px 14px; font-size:12.5px; font-weight:600; transition:all .15s;}
  .pill-toggle button:hover{border-color:var(--ink);}
  .pill-toggle button.active{background:var(--ink); border-color:var(--ink); color:#fff;}
  .chip-toggle{display:flex; gap:6px; flex-wrap:wrap;}
  .chip-toggle button{border:1px solid var(--line-strong); background:var(--surface); color:var(--ink); border-radius:9999px; padding:7px 13px; font-size:12px; font-weight:600; transition:all .15s;}
  .chip-toggle button.active{border-color:var(--ink); background:var(--panel);}
  .categories-trigger{display:flex; align-items:center; gap:8px; border:1px solid var(--line-strong); background:var(--surface); border-radius:9999px; padding:9px 16px; font-size:12.5px; font-weight:600; margin-bottom:14px;}
  .categories-trigger svg{width:15px;height:15px;}
  @media(min-width:900px){ .categories-trigger{display:none;} }

  .browse-layout{display:flex; gap:36px; align-items:flex-start; padding-bottom:40px;}
  .rail{width:248px; flex-shrink:0; display:none; border-top:1px solid var(--line);}
  @media(min-width:900px){ .rail{display:block;} }
  .rail-item{display:flex; align-items:baseline; gap:11px; width:100%; text-align:left; border:none; background:transparent; border-bottom:1px solid var(--line); padding:10px 10px; font-size:13px; color:var(--ink); transition:background .12s;}
  .rail-item:hover{background:var(--panel);}
  .rail-item .idx{font-family:'Newsreader',serif; font-size:13px; color:var(--line-strong); min-width:18px;}
  .rail-item.active{background:var(--panel); font-weight:600;}
  .rail-item.active .idx{color:var(--body);}

  .grid-col{min-width:0; flex:1;}
  .product-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:16px;}
  @media(min-width:640px){ .product-grid{grid-template-columns:repeat(3,1fr);} }
  @media(min-width:1024px){ .product-grid{grid-template-columns:repeat(4,1fr);} }

  .card{display:flex; flex-direction:column; border:1px solid var(--line); background:var(--surface);}
  .card-img{position:relative; aspect-ratio:1/1; display:flex; align-items:center; justify-content:center; padding:12px; background-image:repeating-linear-gradient(135deg, var(--img-a) 0 8px, var(--img-b) 8px 16px);}
  .card-img span{font-family:'Menlo','Consolas',monospace; font-size:9.5px; letter-spacing:.02em; color:#9b9a8f; text-align:center; line-height:1.4;}
  .card-body{padding:12px 12px 0;}
  .card-name{font-size:12.5px; font-weight:600; color:var(--ink); line-height:1.35; min-height:34px;}
  .card-meta{margin-top:3px; font-size:11px; color:var(--subtle);}
  .price-compare{display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-top:10px; padding-top:10px; border-top:1px solid var(--line);}
  .price-col{display:flex; flex-direction:column; gap:2px; padding:6px 6px; border:1px solid transparent;}
  .price-col.best{border-color:var(--green); background:#f4f8f5;}
  .store-row{display:flex; align-items:center; gap:4px;}
  .store-name{font-size:9.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--subtle);}
  .price-col.best .store-name{color:var(--green);}
  .check{width:11px; height:11px; flex-shrink:0; color:var(--green);}
  .price-val{font-family:'Newsreader',serif; font-size:18px; line-height:1.05; color:var(--ink);}
  .price-col.best .price-val{color:var(--green);}
  .single-store-note{margin-top:10px; padding-top:10px; border-top:1px solid var(--line); display:flex; align-items:baseline; justify-content:space-between; gap:8px;}
  .single-store-note .price-val{font-size:20px;}
  .only-at{font-size:10px; color:var(--subtle); text-align:right; line-height:1.3;}
  .save-badge{display:inline-flex; align-self:flex-start; margin-top:9px; background:var(--yellow); color:var(--yellow-ink); font-size:10px; font-weight:700; padding:3px 6px;}
  .card-actions{padding:10px 12px 12px; margin-top:auto;}
  .add-btn{width:100%; border:none; border-radius:2px; background:var(--green); color:#fff; font-size:12px; font-weight:600; padding:9px 10px; transition:background .15s;}
  .add-btn:hover{background:var(--green-hover);}
  .add-btn.added{background:var(--ink-inverse);}

  .empty-state{display:none; flex-direction:column; align-items:flex-start; gap:6px; border:1px solid var(--line); background:var(--surface); padding:48px 32px; text-align:left;}
  .empty-state.visible{display:flex;}
  .empty-state h3{font-family:'Newsreader',serif; font-size:22px; font-weight:400; color:var(--ink);}
  .empty-state p{font-size:13px; color:var(--muted); max-width:44ch;}
  .empty-state button{margin-top:10px; border:1px solid var(--ink); background:transparent; color:var(--ink); border-radius:9999px; padding:9px 18px; font-size:12.5px; font-weight:600;}
  .empty-state button:hover{background:var(--panel);}

  .mobile-cats{display:none; position:fixed; inset:0; z-index:50;}
  .mobile-cats.open{display:block;}
  .mobile-cats-scrim{position:absolute; inset:0; background:rgba(0,0,0,.4); border:none; padding:0;}
  .mobile-cats-panel{position:absolute; top:64px; left:24px; right:24px; max-height:70vh; overflow-y:auto; background:var(--surface); border:1px solid var(--line);}
  .mobile-cats-panel .rail-item{padding:12px 14px;}
</style>
</head>
<body>
  <div id="banner"></div>
  <div id="header"></div>

  <main class="container">
    <div class="page-head">
      <div class="page-eyebrow-row">
        <h1 class="page-title serif">Browse groceries</h1>
        <span class="result-count" id="result-count"></span>
      </div>
      <p class="page-sub">Coles and Woolworths prices shown side-by-side, so the cheaper option is never hidden.</p>
    </div>

    <button class="categories-trigger" id="cats-trigger" aria-haspopup="true" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="14" y2="17"/></svg>
      Categories: <span id="cats-trigger-label">Fruit &amp; Veg</span>
    </button>

    <div class="controls-bar">
      <div class="control-group">
        <span class="control-label">Store</span>
        <div class="chip-toggle" id="store-group" role="group" aria-label="Filter by store availability">
          <button class="active" data-store="both">Both stores</button>
          <button data-store="coles">Coles only</button>
          <button data-store="woolworths">Woolworths only</button>
        </div>
      </div>
      <div class="control-group">
        <span class="control-label">Sort</span>
        <div class="pill-toggle" id="sort-group" role="group" aria-label="Sort products">
          <button class="active" data-sort="recommended">Recommended</button>
          <button data-sort="price-asc">Price: low to high</button>
          <button data-sort="savings-desc">Biggest saving</button>
        </div>
      </div>
    </div>

    <div class="sub-strip" id="sub-strip" aria-label="Subcategories"></div>

    <div class="browse-layout">
      <nav class="rail" id="rail" aria-label="Grocery categories"></nav>
      <div class="grid-col">
        <div class="product-grid" id="product-grid"></div>
        <div class="empty-state" id="empty-state">
          <h3 class="serif">No items here yet</h3>
          <p>We haven't loaded prices for this category yet, or your store filter is hiding everything in it. Try another category, or reset the store filter.</p>
          <button id="empty-reset">Show both stores</button>
        </div>
      </div>
    </div>
  </main>

  <div class="mobile-cats" id="mobile-cats">
    <button class="mobile-cats-scrim" aria-label="Close categories" id="mobile-cats-close"></button>
    <div class="mobile-cats-panel" id="mobile-cats-panel"></div>
  </div>

  <div id="footer"></div>

  <script src="data.js"></script>
  <script src="shared.js"></script>
  <script>
    document.getElementById('banner').innerHTML = renderVariantBanner('a');
    document.getElementById('header').innerHTML = renderHeader();
    document.getElementById('footer').innerHTML = renderFooter();

    let state = { category: "Fruit & Veg", sub: "All", sort: "recommended", store: "both" };

    function renderRail(){
      const rail = document.getElementById('rail');
      const mobilePanel = document.getElementById('mobile-cats-panel');
      rail.innerHTML = ""; mobilePanel.innerHTML = "";
      CATEGORIES.forEach((cat, i) => {
        const idx = String(i + 1).padStart(2, "0");
        [rail, mobilePanel].forEach(target => {
          const btn = document.createElement('button');
          btn.className = 'rail-item' + (cat === state.category ? ' active' : '');
          btn.innerHTML = `<span class="idx serif">${idx}</span><span>${cat}</span>`;
          btn.addEventListener('click', () => {
            state.category = cat;
            state.sub = "All";
            document.getElementById('mobile-cats').classList.remove('open');
            document.getElementById('cats-trigger').setAttribute('aria-expanded', 'false');
            render();
          });
          target.appendChild(btn);
        });
      });
      document.getElementById('cats-trigger-label').textContent = state.category;
    }

    function renderSubStrip(){
      const strip = document.getElementById('sub-strip');
      const subs = SUBCATEGORIES[state.category] || [];
      strip.innerHTML = "";
      ["All", ...subs].forEach(sub => {
        const btn = document.createElement('button');
        btn.className = 'sub-chip' + (sub === state.sub ? ' active' : '');
        btn.textContent = sub;
        btn.addEventListener('click', () => {
          state.sub = sub;
          renderSubStrip();
          renderGrid();
        });
        strip.appendChild(btn);
      });
    }

    function renderCard(p){
      const div = document.createElement('div');
      div.className = 'card';
      const hasBoth = p.coles != null && p.woolworths != null;
      const colesCheaper = hasBoth && p.coles < p.woolworths;
      const woolsCheaper = hasBoth && p.woolworths < p.coles;
      const tie = hasBoth && p.coles === p.woolworths;
      const save = hasBoth ? Math.abs(p.coles - p.woolworths) : 0;

      let priceBlock;
      if(hasBoth){
        priceBlock = `
          <div class="price-compare">
            <div class="price-col ${colesCheaper||tie ? 'best' : ''}">
              <div class="store-row"><span class="store-name">Coles</span>${colesCheaper||tie ? checkIconSvg('check') : ''}</div>
              <span class="price-val serif">${fmt(p.coles)}</span>
            </div>
            <div class="price-col ${woolsCheaper||tie ? 'best' : ''}">
              <div class="store-row"><span class="store-name">Woolworths</span>${woolsCheaper||tie ? checkIconSvg('check') : ''}</div>
              <span class="price-val serif">${fmt(p.woolworths)}</span>
            </div>
          </div>
          ${save > 0 ? `<span class="save-badge">Save ${fmt(save)}</span>` : ''}
        `;
      } else {
        const store = p.coles != null ? 'Coles' : 'Woolworths';
        const price = p.coles != null ? p.coles : p.woolworths;
        priceBlock = `
          <div class="single-store-note">
            <span class="price-val serif">${fmt(price)}</span>
            <span class="only-at">Only at<br>${store}</span>
          </div>
        `;
      }

      div.innerHTML = `
        <div class="card-img"><span>${p.shot}</span></div>
        <div class="card-body">
          <p class="card-name">${p.name}</p>
          <p class="card-meta">${p.unit}</p>
          ${priceBlock}
        </div>
        <div class="card-actions">
          <button class="add-btn" type="button">Add to cart</button>
        </div>
      `;
      return div;
    }

    function renderGrid(){
      const grid = document.getElementById('product-grid');
      const empty = document.getElementById('empty-state');
      const all = PRODUCTS[state.category] || [];
      const filtered = sortProducts(all.filter(p => passesStoreFilter(p, state.store) && passesSubFilter(p, state.sub)), state.sort);

      grid.innerHTML = "";
      if(filtered.length === 0){
        grid.style.display = 'none';
        empty.classList.add('visible');
      } else {
        grid.style.display = 'grid';
        empty.classList.remove('visible');
        filtered.forEach(p => grid.appendChild(renderCard(p)));
      }
      bindAddButtons(grid);
      document.getElementById('result-count').textContent =
        filtered.length > 0 ? `${filtered.length} item${filtered.length === 1 ? '' : 's'}` : '';
    }

    function render(){ renderRail(); renderSubStrip(); renderGrid(); }

    document.getElementById('sort-group').addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-sort]');
      if(!btn) return;
      state.sort = btn.dataset.sort;
      [...e.currentTarget.children].forEach(b => b.classList.toggle('active', b === btn));
      renderGrid();
    });
    document.getElementById('store-group').addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-store]');
      if(!btn) return;
      state.store = btn.dataset.store;
      [...e.currentTarget.children].forEach(b => b.classList.toggle('active', b === btn));
      renderGrid();
    });
    document.getElementById('empty-reset').addEventListener('click', () => {
      state.store = 'both';
      document.querySelectorAll('#store-group button').forEach(b => b.classList.toggle('active', b.dataset.store === 'both'));
      renderGrid();
    });
    const catsTrigger = document.getElementById('cats-trigger');
    const mobileCats = document.getElementById('mobile-cats');
    catsTrigger.addEventListener('click', () => {
      const open = mobileCats.classList.toggle('open');
      catsTrigger.setAttribute('aria-expanded', String(open));
    });
    document.getElementById('mobile-cats-close').addEventListener('click', () => {
      mobileCats.classList.remove('open');
      catsTrigger.setAttribute('aria-expanded', 'false');
    });

    render();
  </script>
</body>
</html>
